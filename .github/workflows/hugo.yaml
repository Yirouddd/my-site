name: Deploy Hugo to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo Extended
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.120.4'
          extended: true

      - name: Debug - Check Current State
        run: |
          echo "=== Current directory structure ==="
          ls -la
          echo "=== Themes directory ==="
          ls -la themes/ || echo "No themes directory found"
          echo "=== Checking if hugo-profile exists ==="
          ls -la themes/hugo-profile/ 2>/dev/null && echo "Theme exists" || echo "Theme missing"

      - name: Install Theme with Error Handling
        run: |
          # 清理可能损坏的主题
          rm -rf themes/hugo-profile
          
          echo "=== Downloading theme with wget ==="
          mkdir -p themes
          cd themes
          
          # 使用wget下载，添加重试机制
          wget --tries=3 --timeout=30 -O hugo-profile.zip https://github.com/gurusabarish/hugo-profile/archive/main.zip
          
          if [ $? -eq 0 ]; then
            echo "✅ Download successful"
            unzip -q hugo-profile.zip
            mv hugo-profile-main hugo-profile
            rm hugo-profile.zip
            echo "✅ Theme extracted successfully"
          else
            echo "❌ Download failed, trying curl..."
            curl -L -o hugo-profile.zip https://github.com/gurusabarish/hugo-profile/archive/main.zip
            if [ $? -eq 0 ]; then
              unzip -q hugo-profile.zip
              mv hugo-profile-main hugo-profile
              rm hugo-profile.zip
              echo "✅ Theme extracted successfully with curl"
            else
              echo "❌ All download methods failed"
              exit 1
            fi
          fi
          
          cd ..

      - name: Verify Theme Installation
        run: |
          echo "=== Verifying theme structure ==="
          ls -la themes/hugo-profile/ || exit 1
          echo "=== Checking CSS files ==="
          find themes/hugo-profile/static -name "*.css" | head -5
          echo "=== Checking theme configuration ==="
          ls -la themes/hugo-profile/theme.yaml || ls -la themes/hugo-profile/*.yaml | head -2

      - name: Build Hugo Site
        run: |
          echo "=== Building site ==="
          rm -rf public
          hugo --minify --verbose

      - name: Verify Build Output
        run: |
          echo "=== Checking built files ==="
          echo "Public directory:"
          ls -la public/ | head -10
          echo "CSS files:"
          find public -name "*.css" | head -10
          echo "JS files:"
          find public -name "*.js" | head -10
          
          # 关键检查
          if [ -f "public/css/style.min.css" ]; then
            echo "✅ SUCCESS: style.min.css found"
            echo "File size:" $(stat -c%s "public/css/style.min.css") "bytes"
          else
            echo "❌ FAILED: style.min.css missing"
            echo "Available CSS files:"
            find public -name "*.css" -exec ls -la {} \;
          fi

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        if: success()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: true