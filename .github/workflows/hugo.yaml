name: Deploy Hugo to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Hugo Extended
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.120.4'
          extended: true

      - name: Force Install Theme
        run: |
          echo "=== Current directory structure ==="
          ls -la
          
          echo "=== Removing existing theme ==="
          rm -rf themes/hugo-profile
          
          echo "=== Downloading fresh theme ==="
          mkdir -p themes
          cd themes
          wget -q https://github.com/gurusabarish/hugo-profile/archive/main.zip -O hugo-profile.zip
          unzip -q hugo-profile.zip
          mv hugo-profile-main hugo-profile
          rm hugo-profile.zip
          cd ..
          
          echo "=== Verifying theme installation ==="
          ls -la themes/hugo-profile/static/css/ || echo "CSS directory check failed"
          find themes/hugo-profile/static -name "*.css" | head -5

      - name: Build Site
        run: |
          echo "=== Building site ==="
          rm -rf public
          hugo --minify --verbose --cleanDestinationDir

      - name: Verify Build Output
        run: |
          echo "=== Checking built files ==="
          ls -la public/ || echo "Public directory missing"
          find public -name "*.css" | head -10
          [ -f "public/css/style.min.css" ] && echo "✅ SUCCESS: style.min.css found" || echo "❌ FAILED: style.min.css missing"
          [ -f "public/css/bootstrap.min.css" ] && echo "✅ SUCCESS: bootstrap.min.css found" || echo "❌ FAILED: bootstrap.min.css missing"

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        if: success()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: true