name: Hugo — Build and deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    outputs:
      pages-artifact-path: ./public
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.151.0'
          extended: true

      - name: Install theme (if missing)
        run: |
          # Ensure the theme is available (the theme in this repo is `themes/hugo-profile`).
          if [ ! -d "themes/hugo-profile" ]; then
            echo "Installing hugo-profile theme..."
            mkdir -p themes
            git -C themes clone --depth 1 https://github.com/gurusabarish/hugo-profile.git || true
          fi

      - name: Build the site
        run: |
          # Generate the site into ./public
          hugo --gc --minify --cleanDestinationDir

      - name: Verify output and list public/
        run: |
          echo "Public directory contents:"
          ls -la public || true
          echo "Found CSS files:"; find public -name "*.css" -maxdepth 3 || true

      - name: Upload Pages artifact
        # Use the current supported upload-pages-artifact action
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4