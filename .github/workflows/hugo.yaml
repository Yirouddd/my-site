name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.151.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Hugo (extended)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Install theme (if missing)
        run: |
          if [ ! -d "themes/hugo-profile" ]; then
            echo "Installing hugo-profile theme..."
            mkdir -p themes
            git -C themes clone --depth 1 https://github.com/gurusabarish/hugo-profile.git || true
          fi

      - name: Copy theme exampleSite static -> root static (if present)
        run: |
          if [ -d "themes/hugo-profile/exampleSite/static" ]; then
            echo "Copying exampleSite static files into ./static (non-destructive)..."
            mkdir -p static
            cp -rn themes/hugo-profile/exampleSite/static/. static/ || true
          else
            echo "No exampleSite static directory found; skipping copy"
          fi

      - name: Install Node.js dependencies (if present)
        run: |
          if [[ -f package-lock.json || -f npm-shrinkwrap.json ]]; then
            npm ci
          else
            echo "No package-lock.json found; skipping npm ci"
          fi

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: UTC
        run: |
          hugo \
            --gc \
            --minify \
            --cleanDestinationDir \
            --baseURL "${{ steps.pages.outputs.base_url }}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4