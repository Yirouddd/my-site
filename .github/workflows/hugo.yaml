name: Deploy Hugo to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo Extended
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.120.4'
          extended: true

      - name: Install Theme with Correct URL
        run: |
          echo "=== Installing Hugo Profile Theme ==="
          rm -rf themes/hugo-profile
          mkdir -p themes
          cd themes
          
          # 使用正确的下载链接
          echo "Downloading theme..."
          wget --tries=3 --timeout=30 -O hugo-profile.zip https://github.com/gurusabarish/hugo-profile/archive/refs/heads/main.zip
          
          if [ $? -eq 0 ]; then
            echo "✅ Download successful"
            unzip -q hugo-profile.zip
            mv hugo-profile-main hugo-profile
            rm hugo-profile.zip
            echo "✅ Theme extracted successfully"
          else
            echo "❌ wget failed, trying curl..."
            curl -L -o hugo-profile.zip https://github.com/gurusabarish/hugo-profile/archive/refs/heads/main.zip
            if [ $? -eq 0 ]; then
              unzip -q hugo-profile.zip
              mv hugo-profile-main hugo-profile
              rm hugo-profile.zip
              echo "✅ Theme extracted successfully with curl"
            else
              echo "❌ Download failed, using git clone as fallback..."
              git clone https://github.com/gurusabarish/hugo-profile.git
              echo "✅ Theme cloned successfully"
            fi
          fi
          
          cd ..

      - name: Verify Theme Installation
        run: |
          echo "=== Verifying theme ==="
          ls -la themes/hugo-profile/ || exit 1
          echo "=== Checking critical files ==="
          [ -f "themes/hugo-profile/theme.yaml" ] && echo "✅ theme.yaml exists" || echo "❌ theme.yaml missing"
          [ -d "themes/hugo-profile/layouts" ] && echo "✅ layouts exists" || echo "❌ layouts missing"
          [ -d "themes/hugo-profile/static" ] && echo "✅ static exists" || echo "❌ static missing"

      - name: Build Hugo Site
        run: |
          echo "=== Building site ==="
          rm -rf public
          hugo --minify --verbose

      - name: Verify Build Output
        run: |
          echo "=== Build verification ==="
          echo "Public directory contents:"
          ls -la public/ | head -15
          echo "CSS files:"
          find public -name "*.css" 2>/dev/null | head -10 || echo "No CSS files found"
          echo "JS files:"
          find public -name "*.js" 2>/dev/null | head -10 || echo "No JS files found"
          
          # 关键文件检查
          if [ -f "public/css/style.min.css" ]; then
            echo "✅ SUCCESS: style.min.css found - build is working!"
            echo "File size:" $(wc -c < "public/css/style.min.css") "bytes"
          else
            echo "❌ style.min.css missing"
            echo "Available files in public/css/:"
            ls -la public/css/ 2>/dev/null || echo "No css directory"
          fi

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        if: success()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: true