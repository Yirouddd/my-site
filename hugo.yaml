      I am a second-year BSc Artificial Intelligence student at the University of Edinburgh.
      
      Through coursework, team activities, and personal projects, I have been developing my programming skills and exploring how AI systems can be made more structured, useful, and reliable in practice. I enjoy working on projects that combine implementation with careful reasoning, and I hope to keep learning through both technical and research opportunities.
    skills:
