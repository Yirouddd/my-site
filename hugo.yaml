        image: /images/achievement.jpg

  # Projects Section - 更新为你的项目
  projects:
    enable: true
    items:
      - title: "Hybrid Chess Analyzer"
        content: "A chess coaching system combining Google Gemini 1.5 Pro with Stockfish. I designed JSON-based function calling for more reliable tool use, implemented session-based state tracking, and built a modular architecture for real-time analysis. This project made me more interested in structured LLM behaviour and reliability in reasoning-heavy settings."
        image: /images/projects/hybrid-chess-analysis.png
        featured:
          name: "Live Demo"
          link: https://github.com/Yirouddd/Hybrid-Chess-Analyzer
        badges:
          - "Python"
          - "Google Gemini API"
          - "Gradio"
          - "Stockfish"
        links:
          - icon: fab fa-github
            url: https://github.com/Yirouddd/Hybrid-Chess-Analyzer

      - title: "Handwritten Digit Recognition System"
        content: "A handwritten digit recognition project built with TensorFlow/Keras and trained on MNIST. I implemented and tested an end-to-end ML pipeline, including preprocessing, model training, and evaluation. This helped me build practical experience with core machine learning workflows."
        image: /images/projects/handwritten.png
        featured:
          name: "Live Demo"
          link: https://github.com/Yirouddd/handwritten-digit-recognition
        badges:
          - "Machine Learning"
          - "Python"
          - "TensorFlow"
          - "OpenCV"
          - "NumPy"
          - "Matplotlib"
        links:
          - icon: fab fa-github
            url: https://github.com/Yirouddd/handwritten-digit-recognition

      - title: "Seasons Through the Window Variations of the Pythagoras Tree"
        content: "This project is a Haskell program that creates a visual simulation of seasonal scenes with falling snowflakes using the Gloss graphics library. It combines dynamic visual effects, such as snowfall, with static seasonal Pythagoras tree representations."
        image: /images/projects/tree-demo.gif
        featured:
          name: "Live Demo"
          link: https://github.com/Yirouddd/Seasons-Through-the-Window-Variations-of-the-Pythagoras-Tree
        badges:
          - "Haskell"
        links:
          - icon: fab fa-github
            url: https://github.com/Yirouddd/handwritten-digit-recognition
            
