baseURL: "https://Yirouddd/yiroudong.github.io/" 
languageCode: "en-us"
title: "Yirou Dong - Portfolio"  # ← 改成你的名字
theme: hugo-profile

# 添加GitHub Pages必需的配置
relativeURLs: false
canonifyURLs: true
enableGitInfo: false

# Add cache configuration for GitHub Pages
caches:
  images:
    dir: ':cacheDir/images'

outputs:
  home:
    - "HTML"
    - "RSS"
    - "JSON"
  page:
    - "HTML"
    - "RSS"

enableRobotsTXT: true

#services:
  #googleAnalytics:
    #id: G-MEASUREMENT_ID
  #disqus:
    #shortname: your-disqus-shortname

pagination:
  pagerSize: 3

markup:
  goldmark:
    renderer:
      unsafe: true

Menus:
  main:
    - identifier: blog
      name: Blog
      title: Blog posts
      url: /blogs
      weight: 1
    - identifier: gallery
      name: Gallery
      title: Gallery
      url: /gallery
      weight: 2

params:
  title: "Yirou Dong"  # ← 改成你的名字
  description: "A passionate web developer specializing in modern web technologies"
  favicon: "/fav.png"

  useBootstrapCDN: false
  mathjax: false
  animate: true

  theme:
    # disableThemeToggle: true
    # defaultTheme: "light" # dark

  font:
    fontSize: 1rem
    fontWeight: 400
    lineHeight: 1.5
    textAlign: left

  navbar:
    align: ms-auto
    brandName: "Yirou Dong"  # ← 改成你的名字
    disableSearch: false
    stickyNavBar:
      enable: true
      showOnScrollUp: true
    enableSeparator: false
    menus:
      disableAbout: false
      disableExperience: false
      disableEducation: false
      disableProjects: false
      disableAchievements: false
      disableContact: false

  # Hero Section - 更新为你的信息
  hero:
    enable: true
    intro: "Hi, my name is"
    title: "Yirou Dong."  # ← 改成你的名字
    subtitle: "Crafting tomorrow's mind"
    content: "AI student at the University of Edinburgh. I bridge theoretical research and practical systems, building a future powered by machine learning and algorithms."
    image: /images/hero.jpg
    bottomImage:
      enable: true
    button:
      enable: true
      name: "Download Resume"
      url: "/files/resume.pdf"
      download: true
      newPage: false
    socialLinks:
      fontAwesomeIcons:
        - icon: fab fa-github
          url: https://github.com/Yirouddd  # ← 改成你的GitHub
        - icon: fab fa-linkedin
          url: https://linkedin.com/in/yourprofile  # ← 改成你的LinkedIn
        - icon: fab fa-x-twitter
          url: https://twitter.com/yourusername  # ← 改成你的Twitter

  # About Section
  about:
    enable: true
    title: "About Me"
    image: "/images/me.png"
    content: |-
      I am a passionate developer with expertise in web technologies. I enjoy creating digital experiences that are both beautiful and functional.

      Currently, I'm focused on building accessible, human-centered products and continuously learning new technologies to enhance my skills.
    skills:
      enable: true
      title: "Here are a few technologies I've been working with recently:"
      items:
        - "HTML/CSS"
        - "JavaScript"
        - "React"
        - "Node.js"
        - "Git"
        - "Hugo"

  # Experience Section - 更新为你的经历
  experience:
    enable: true
    items:
      - company: "Your Company"
        companyUrl: "https://example.com"
        jobs:
          - name: "Your Position"
            date: "2023 - Present"
            content: "Describe your responsibilities and achievements here. Focus on what you accomplished and the impact you made."

  # Education Section - 更新为你的教育背景
  education:
    enable: true
    items:
      - title: "Your Degree"
        school:
          name: "Your University"
          url: "https://university.edu"
        date: "2020 - 2024"
        GPA: "3.8/4.0"
        content: |-
          Relevant coursework and achievements. Highlight projects, research, or extracurricular activities related to your field.

  # Achievements Section - 更新为你的成就
  achievements:
    enable: true
    items:
      - title: "Your Achievement"
        content: "Brief description of what you accomplished and why it matters."
        url: https://example.com
        image: /images/achievement.jpg

  # Projects Section - 更新为你的项目
  projects:
    enable: true
    items:
      - title: "My Portfolio Website"
        content: "A personal portfolio website built with Hugo and Hugo Profile theme, deployed on GitHub Pages."
        image: /images/projects/portfolio.jpg
        featured:
          name: "Live Demo"
          link: https://yirouddd.github.io
        badges:
          - "Hugo"
          - "GitHub Pages"
          - "HTML/CSS"
        links:
          - icon: fab fa-github
            url: https://github.com/Yirouddd/yiroudong.github.io

  # Contact Section
  contact:
    enable: true
    content: "I'm always interested in new opportunities and connections. Feel free to reach out if you'd like to chat!"
    btnName: "Say Hello"
    btnLink: "mailto:your.email@example.com"  # ← 改成你的邮箱

  footer:
    recentPosts:
      path: "blogs"
      count: 3
      title: "Recent Posts"
      enable: true
      disableFeaturedImage: false
    socialNetworks:
      github: https://github.com/Yirouddd  # ← 改成你的GitHub
      linkedin: https://linkedin.com/in/yourprofile  # ← 改成你的LinkedIn
      twitter: https://twitter.com/yourusername  # ← 改成你的Twitter

  listPages:
    disableFeaturedImage: false

  singlePages:
    socialShare: true
    readTime:
      enable: true
      content: "min read"
    scrollprogress:
      enable: true
    tags:
      openInNewTab: true

  terms:
    read: "Read"
    toc: "Table Of Contents"
    copyright: "All rights reserved"
    pageNotFound: "Page not found"
    emailText: "Check out this site"

  datesFormat:
    article: "Jan 2, 2006"
    articleList: "Jan 2, 2006"
    articleRecent: "Jan 2, 2006"