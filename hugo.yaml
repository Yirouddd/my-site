baseURL: "https://Yirouddd/yiroudong.github.io/" 
languageCode: "en-us"
title: "Yirou Dong - Portfolio"  # ← 改成你的名字
theme: hugo-profile

# 添加GitHub Pages必需的配置
relativeURLs: false
canonifyURLs: true
enableGitInfo: false

# Add cache configuration for GitHub Pages
caches:
  images:
    dir: ':cacheDir/images'

outputs:
  home:
    - "HTML"
    - "RSS"
    - "JSON"
  page:
    - "HTML"
    - "RSS"

enableRobotsTXT: true

#services:
  #googleAnalytics:
    #id: G-MEASUREMENT_ID
  #disqus:
    #shortname: your-disqus-shortname

pagination:
  pagerSize: 3

markup:
  goldmark:
    renderer:
      unsafe: true

Menus:
  main:
    - identifier: blog
      name: Blog
      title: Blog posts
      url: /blogs
      weight: 1
    - identifier: gallery
      name: Gallery
      title: Gallery
      url: /gallery
      weight: 2

params:
  title: "Yirou Dong"  # ← 改成你的名字
  description: "A passionate web developer specializing in modern web technologies"
  favicon: "/fav.png"

  useBootstrapCDN: false
  mathjax: false
  animate: true

  theme:
    # disableThemeToggle: true
    # defaultTheme: "light" # dark

  font:
    fontSize: 1rem
    fontWeight: 400
    lineHeight: 1.5
    textAlign: left

  navbar:
    align: ms-auto
    brandName: "Yirou Dong"  # ← 改成你的名字
    disableSearch: false
    stickyNavBar:
      enable: true
      showOnScrollUp: true
    enableSeparator: false
    menus:
      disableAbout: false
      disableExperience: false
      disableEducation: false
      disableProjects: false
      disableAchievements: false
      disableContact: false

  # Hero Section - 更新为你的信息
  hero:
    enable: true
    intro: "Hi, my name is"
    title: "Yirou Dong."  # ← 改成你的名字
    subtitle: "Crafting tomorrow's mind"
    content: "AI student at the University of Edinburgh. I bridge theoretical research and practical systems, building a future powered by machine learning and algorithms."
    image: /images/hero.jpg
    bottomImage:
      enable: true
    button:
      enable: true
      name: "Download Resume"
      url: "/files/resume.pdf"
      download: true
      newPage: false
    socialLinks:
      fontAwesomeIcons:
        - icon: fab fa-github
          url: https://github.com/Yirouddd  # ← 改成你的GitHub
        - icon: fab fa-linkedin
          url: https://linkedin.com/in/yourprofile  # ← 改成你的LinkedIn
        - icon: fab fa-x-twitter
          url: https://twitter.com/yourusername  # ← 改成你的Twitter

  # About Section
  about:
    enable: true
    title: "About Me"
    image: "/images/me.jpg"
    content: |-
      I’m Yirou Dong, currently pursuing a B.Sc. in Artificial Intelligence at the University of Edinburgh. My studies have given me a strong foundation in programming, algorithms, and data-driven problem solving.
      
      I’ve applied this knowledge through a series of independent and academic projects that explore how intelligent systems can be modeled and understood through code. I’m passionate about continuous learning and enjoy challenging myself to design more efficient, reliable, and creative solutions.
    skills:
      enable: true
      title: "Here are a few technologies I've been working with recently:"
      items:
        - "Java"
        - "Python"
        - "C++"
        - "ROS2"
        - "Git"
        - "C"

  # Experience Section - 更新为你的经历
  experience:
    enable: true
    items:
      - company: "EUFS"
        companyUrl: "https://www.eufs.co/"
        jobs:
          - name: "Planning and Control Team Member"
            date: "2025 - Present"
            content: "Transforms perception data into driving actions. They develop algorithms for path planning, steering, and speed control to make the car drive fast, smooth, and safe."

  # Education Section - 更新为你的教育背景
  education:
    enable: true
    items:
      - title: "BSc Artificial Intelligence"
        school:
          name: "University of Edinburgh"
          url: "https://www.ed.ac.uk/"
        date: "2024 - 2028"
        GPA: "92.5% (first year)"
        content: |-
          Relevant coursework includes Machine Learning, Data Structures, and Functional Programming. I’ve applied these concepts through projects such as neural network replication, visual system simulation, and autonomous racing development with the Edinburgh University Formula Student team.

      - title: "Sciences and Technologies – Ensino Secundário (Portugal)"
        school:
          name: "Bernardino Machado Secondary School (Portugal)"
          url: "https://www.ed.ac.uk/"
        date: "2021 - 2024"
        GPA: "19/20"
        content: |-
          Awarded Best Student for three consecutive years in recognition of outstanding academic performance and leadership.
  # Achievements Section - 更新为你的成就
  achievements:
    enable: true
    items:
      - title: "Best Student Award"
        content: "Received the Best Student Award for three consecutive years, ranking first in overall academic performance and demonstrating strong commitment to excellenc"
        url: "/images/diploma.jpg"
        image: /images/achievement.jpg

  # Projects Section - 更新为你的项目
  projects:
    enable: true
    items:
      - title: "Handwritten Digit Recognition System"
        content: "A personal portfolio website built with Hugo and Hugo Profile theme, deployed on GitHub Pages."
        image: /images/projects/handwritten.png
        featured:
          name: "Live Demo"
          link: https://github.com/Yirouddd/handwritten-digit-recognition
        badges:
          - "Machine Learning"
          - "Python"
          - "TensorFlow"
          - "OpenCV"
          - "NumPy"
          - "Matplotlib"
        links:
          - icon: fab fa-github
            url: https://github.com/Yirouddd/handwritten-digit-recognition

  # Contact Section
  contact:
    enable: true
    content: "I'm always interested in new opportunities and connections. Feel free to reach out if you'd like to chat!"
    btnName: "Say Hello"
    btnLink: "s2646523@ed.ac.uk"  # ← 改成你的邮箱

  footer:
    recentPosts:
      path: "blogs"
      count: 3
      title: "Recent Posts"
      enable: true
      disableFeaturedImage: false
    socialNetworks:
      github: https://github.com/Yirouddd  # ← 改成你的GitHub
      linkedin: https://linkedin.com/in/yourprofile  # ← 改成你的LinkedIn
      twitter: https://twitter.com/yourusername  # ← 改成你的Twitter

  listPages:
    disableFeaturedImage: false

  singlePages:
    socialShare: true
    readTime:
      enable: true
      content: "min read"
    scrollprogress:
      enable: true
    tags:
      openInNewTab: true

  terms:
    read: "Read"
    toc: "Table Of Contents"
    copyright: "All rights reserved"
    pageNotFound: "Page not found"
    emailText: "Check out this site"

  datesFormat:
    article: "Jan 2, 2006"
    articleList: "Jan 2, 2006"
    articleRecent: "Jan 2, 2006"