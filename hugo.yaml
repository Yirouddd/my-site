baseURL: "https://Yirouddd/yiroudong.github.io/"  # ← CHANGE THIS 
languageCode: "en-us"
title: "Irene - Portfolio"  # ← CHANGE THIS
theme: hugo-profile

# Add cache configuration for GitHub Pages
caches:
  images:
    dir: ':cacheDir/images'

outputs:
  home:
    - "HTML"
    - "RSS"
    - "JSON"
  page:
    - "HTML"
    - "RSS"

enableRobotsTXT: true

# Uncomment and configure these services as needed:
#services:
  #googleAnalytics:
    #id: G-MEASUREMENT_ID
  #disqus:
    #shortname: your-disqus-shortname

pagination:
  pagerSize: 3

markup:
  goldmark:
    renderer:
      unsafe: true

Menus:
  main:
    - identifier: blog
      name: Blog
      title: Blog posts
      url: /blogs
      weight: 1
    - identifier: gallery
      name: Gallery
      title: Gallery
      url: /gallery
      weight: 2

params:
  title: "Irene"  # ← CHANGE THIS
  description: "A passionate web developer specializing in modern web technologies"  # ← CHANGE THIS
  favicon: "/fav.png"

  useBootstrapCDN: false
  mathjax: false
  animate: true

  theme:
    # disableThemeToggle: true
    # defaultTheme: "light" # dark

  font:
    fontSize: 1rem
    fontWeight: 400
    lineHeight: 1.5
    textAlign: left

  navbar:
    align: ms-auto
    brandName: "Irene"  # ← CHANGE THIS
    disableSearch: false
    stickyNavBar:
      enable: true
      showOnScrollUp: true
    enableSeparator: false
    menus:
      disableAbout: false
      disableExperience: false
      disableEducation: false
      disableProjects: false
      disableAchievements: false
      disableContact: false

  # Hero Section - UPDATE ALL THIS
  hero:
    enable: true
    intro: "Hi, my name is"
    title: "Irene."  # ← CHANGE THIS
    subtitle: "I build things for the web"  # ← CHANGE THIS
    content: "A passionate web developer specializing in modern web technologies. I create websites that look great, feel fantastic, and function perfectly."  # ← CHANGE THIS
    image: /images/hero.svg
    bottomImage:
      enable: true
    button:
      enable: true
      name: "Download Resume"
      url: "/files/resume.pdf"  # ← Make sure this file exists in static/files/
      download: true
      newPage: false
    socialLinks:
      fontAwesomeIcons:
        - icon: fab fa-github
          url: https://github.com/Yirouddd  # ← CHANGE THIS
        - icon: fab fa-linkedin
          url: https://linkedin.com/in/YOUR_PROFILE  # ← CHANGE THIS
        - icon: fab fa-twitter
          url: https://twitter.com/Yirouddd  # ← CHANGE THIS

  # About Section - UPDATE THIS
  about:
    enable: true
    title: "About Me"
    image: "/images/me.png"  # ← Add your photo to static/images/me.png
    content: |-
      I am a passionate developer with expertise in web technologies. I enjoy creating digital experiences that are both beautiful and functional.

      Currently, I'm focused on building accessible, human-centered products and continuously learning new technologies to enhance my skills.
    skills:
      enable: true
      title: "Here are a few technologies I've been working with recently:"
      items:
        - "HTML/CSS"
        - "JavaScript"
        - "React"
        - "Node.js"
        - "Git"
        - "Hugo"

  # Experience Section - UPDATE THIS WITH YOUR REAL EXPERIENCE
  experience:
    enable: true
    items:
      - company: "Your Company"
        companyUrl: "https://example.com"
        jobs:
          - name: "Your Position"
            date: "2023 - Present"
            content: "Describe your responsibilities and achievements here. Focus on what you accomplished and the impact you made."
            featuredItems:
              fontAwesomeIcons:
                - icon: fa-brands fa-js
                  url: https://javascript.com/
                  tooltip: JavaScript
                - icon: fab fa-react
                  url: https://react.dev/
                  tooltip: React

  # Education Section - UPDATE WITH YOUR EDUCATION
  education:
    enable: true
    items:
      - title: "Your Degree"
        school:
          name: "Your University"
          url: "https://university.edu"
        date: "2020 - 2024"
        GPA: "3.8/4.0"
        content: |-
          Relevant coursework and achievements. Highlight projects, research, or extracurricular activities related to your field.

  # Achievements Section - UPDATE WITH YOUR ACHIEVEMENTS
  achievements:
    enable: true
    items:
      - title: "Your Achievement"
        content: "Brief description of what you accomplished and why it matters."
        url: https://example.com
        image: /images/achievement.jpg

  # Projects Section - UPDATE WITH YOUR PROJECTS
  projects:
    enable: true
    items:
      - title: "Project Name"
        content: "A brief description of your project, what it does, and the technologies used."
        image: /images/projects/project1.jpg
        featured:
          name: "Live Demo"
          link: https://your-project-demo.com
        badges:
          - "React"
          - "Node.js"
          - "MongoDB"
        links:
          - icon: fab fa-github
            url: https://github.com/yourusername/project

  # Contact Section
  contact:
    enable: true
    content: "I'm always interested in new opportunities and connections. Feel free to reach out if you'd like to chat!"
    btnName: "Say Hello"
    btnLink: "mailto:your.email@example.com"  # ← CHANGE THIS
    # formspree:
    #   enable: true
    #   formId: your-formspree-id

  footer:
    recentPosts:
      path: "blogs"
      count: 3
      title: "Recent Posts"
      enable: true
      disableFeaturedImage: false
    socialNetworks:
      github: https://github.com/Yirouddd  # ← CHANGE THIS
      linkedin: https://linkedin.com/in/YOUR_PROFILE  # ← CHANGE THIS
      twitter: https://twitter.com/YOUR_USERNAME  # ← CHANGE THIS

  listPages:
    disableFeaturedImage: false

  singlePages:
    socialShare: true
    readTime:
      enable: true
      content: "min read"
    scrollprogress:
      enable: true
    tags:
      openInNewTab: true

  terms:
    read: "Read"
    toc: "Table Of Contents"
    copyright: "All rights reserved"
    pageNotFound: "Page not found"
    emailText: "Check out this site"

  datesFormat:
    article: "Jan 2, 2006"
    articleList: "Jan 2, 2006"
    articleRecent: "Jan 2, 2006"